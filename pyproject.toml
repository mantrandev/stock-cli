[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockcli"
version = "0.2.0"
description = "Terminal CLI for Vietnam stock quotes and a local JSON portfolio."
requires-python = ">=3.9"

[project.scripts]
stock = "stockcli.cli:main"
crypto = "stockcli.cli:crypto_main"
fstock = "stockcli.cli:fstock_main"
gold = "stockcli.cli:gold_main"
